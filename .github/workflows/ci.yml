name: Public checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check that every module imports after installation
        run: python -c "import bcm_paths, spline_basis, oosc_model_numpyro, harmonize_admin_data, harmonize_mics, fetch_public_data"
      - name: Run tests
        run: pytest -q
      - name: Run the README synthetic demo
        run: python examples/synthetic_demo/run_demo.py

  r-package:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: "true"
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/oosccohort
          extra-packages: any::rcmdcheck
          needs: check
      - name: R CMD check (includes Stan compilation, NumPyro parity and a short fit)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/oosccohort
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
